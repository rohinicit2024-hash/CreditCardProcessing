<!DOCTYPE html>
<html>

<head>
    <title>Credit Card Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Credit Card Processing System</h1>

        <h2>Dashboard</h2>


        <!-- Customer Details -->

        <div class="section">

            <h3>● Customer Details</h3>

            <p>
                <b>Customer Name:</b>
                <span id="customerName"></span>
            </p>

            <p>
                <b>Card Number:</b>
                **** **** **** 4582
            </p>

            <p>
                <b>Available Credit:</b>
                ₹75,000
            </p>

        </div>


        <!-- Process Payment -->

        <div class="section">

            <h3>● Process Payment</h3>

            <button onclick="window.location.href='payment.html'">
                Process Payment
            </button>

        </div>


        <!-- Transaction History -->

        <div class="section">

            <h3>● Transaction History</h3>

            <button onclick="window.location.href='transactions.html'">
                View Transaction History
            </button>

        </div>


        <!-- Logout -->

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <script src="script.js"></script>

    <script>

        let username =
            localStorage.getItem("username");

        if (!username) {

            window.location.href = "index.html";

        }

        document.getElementById("customerName").textContent =
            username;

    </script>

</body>

</html>
